[project]
name = "cropeval"
version = "0.1.0"
description = "Evaluate the lab-to-field domain gap of plant disease image classifiers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nurshapagat Shapay" }]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
cropeval = "cropeval.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "scikit-learn",  # only used to cross-check our metrics in tests
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cropeval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
