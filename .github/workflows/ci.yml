# Continuous integration: lint and test every push to main and every PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets release.yml run exactly the same checks before publishing.
  workflow_call:

# Cancel an older run of the same branch/PR when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0 # no floating major tag; pin exact release
        with:
          enable-cache: true # cache downloaded packages between runs

      - name: Install dependencies
        run: uv sync --locked # fail if uv.lock is out of date

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # still see results for the other Python version
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      MPLBACKEND: Agg # matplotlib without a display
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.2.0 # no floating major tag; pin exact release
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests with coverage
        run: >-
          uv run pytest
          --cov=cropeval
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
